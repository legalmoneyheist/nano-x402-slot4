[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hermes-nano-x402"
version = "0.1.0"
description = "Hermes Agent plugin: pay x402 'exact' quotes on nano:mainnet (XNO) behind an offline-tested payment guard"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "hermes-nano-x402 contributors" }]
keywords = ["hermes-agent", "hermes", "plugin", "x402", "nano", "xno", "payments", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "hermes-agent==0.19.0",
  "nanopy==28.0.1.post26",
  "x402-nano-exact==0.1.2",
  "requests==2.33.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.scripts]
hermes-nano-x402-demo = "hermes_nano_x402.agent_example:main"
hermes-nano-x402-receive = "hermes_nano_x402.receive:main"

[project.entry-points."hermes_agent.plugins"]
nano-x402 = "hermes_nano_x402"

[project.urls]
Homepage = "https://github.com/OWNER/hermes-nano-x402"
Source = "https://github.com/OWNER/hermes-nano-x402"

[tool.hatch.build.targets.wheel]
packages = ["hermes_nano_x402"]

[tool.hatch.build.targets.sdist]
include = ["hermes_nano_x402", "examples", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["hermes_nano_x402/tests"]
